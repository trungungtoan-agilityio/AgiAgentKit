version: 1
meta:
  title: Session Superadvisor — bảng tra lệnh
  description: Lệnh superadvisor (AgiAgentKit), lệnh vòng đời lane (AgentAutoKit, plugin agent-brains), hook, biến môi trường và thư mục brains.
  locale: vi
theme:
  preset: swiss-clean
blocks:
  - type: hero
    eyebrow: Cheat sheet · Session Superadvisor
    title: Lệnh superadvisor và vòng đời lane
    description: "Phần 1–3 là CLI superadvisor và hook của AgiAgentKit. Phần 4–6 là lệnh vòng đời lane của AgentAutoKit (plugin agent-brains). Chạy từ trong project (git top-level của thư mục hiện tại, hoặc SA_PROJECT)."

  - type: section
    title: 1. Vòng việc hằng ngày
    blocks:
      - type: code
        language: bash
        title: Cài một lần, khởi động leader
        text: |
          superadvisor init <project>
          superadvisor up [<project>] [--dry-run]
      - type: code
        language: bash
        title: Mở và đóng lane
        text: |
          superadvisor lane open <name> --brief <file> [--model <id>] [--worktree <path>] [--dry-run]
          superadvisor lane close <name> [--rm-worktree]
      - type: code
        language: bash
        title: Theo dõi, dọn dẹp, báo cáo
        text: |
          superadvisor status
          superadvisor patrol [--clean [--apply]]
          superadvisor review
          superadvisor report
          superadvisor cron --install [--project <p>] [--dry-run]
          superadvisor cron --uninstall
      - type: timeline
        title: "Lịch của cron --install"
        items:
          - { when: Mỗi 15 phút, title: "patrol --clean --apply", text: "Gắn cờ kẹt, tự đóng lane IDLE đủ idle_close_min (30), đã merge, sạch, đã push." }
          - { when: "22:00", title: review, text: "Review chỉ đọc, lưu vào `brains/.local/reviews/<date>.md`." }
          - { when: "08:00", title: report, text: "Lane, cờ kẹt, commit, chi phí ước tính. Log launchd ở ~/Library/Logs." }

  - type: section
    title: 2. Mỗi lệnh làm gì
    blocks:
      - type: table
        columns: [Lệnh, Làm gì]
        rows:
          - ["init <project>", "Chép template (rules, brains/, một khối CLAUDE.md) vào project. Không bao giờ ghi đè."]
          - ["up [<project>]", "Mở leader <PROJECT>-LEAD trong tmux với Remote Control và auto mode."]
          - ["lane open <name> --brief <file>", "Mở lane: worktree, nhánh lane/<name>, phiên tmux có KIT_LANE=1."]
          - ["lane close <name> [--rm-worktree]", "Dừng lane. Chỉ xoá worktree khi nhánh đã merge."]
          - ["status", "Mỗi phiên một dòng: BUSY, IDLE, WAITING hoặc DEAD, và số phút không đổi."]
          - ["patrol", "Như status, thêm một dòng vào patrol.log và cờ kẹt cho lane quá ngưỡng."]
          - ["patrol --clean --apply", "Đóng lane IDLE đủ lâu, đã merge, sạch, đã push, và xoá worktree."]
          - ["review / report", "Review buổi tối chỉ đọc; báo cáo ngắn hằng ngày: lane, cờ kẹt, commit, chi phí ước tính."]
          - ["cron --install", "patrol 15 phút, review 22:00, report 08:00 (launchd trên macOS, crontab trên Linux). Idempotent."]

  - type: section
    title: 3. Hook và ngưỡng
    blocks:
      - type: table
        columns: [Hook, Chặn, Ngưỡng, Chỉnh bằng]
        rows:
          - [turn-guard, "Lượt builder/tester chạy quá lâu (Read, Grep vẫn qua); khớp type thật của agent", "Cảnh báo 60 và 90 lần gọi tool, chặn từ 130", "TURN_GUARD_WARN, TURN_GUARD_WARN2, TURN_GUARD_DENY, TURN_GUARD_OFF=1"]
          - [test-budget, "Chạy cả bộ test, kể cả sau timeout, nice, sudo", "File, thư mục, -t, -k hoặc --changed thì qua", "Thêm FULL_SUITE_OK=1 vào lệnh"]
          - [agent-routing, "Gọi agent có truyền model, hoặc general-purpose / không có subagent_type", Mọi lần gọi, "Sửa plugin/hooks/agent-routing.sh"]
          - [owner-guard, "Trong lane: merge, push nhánh được bảo vệ, push force/mirror/delete/--no-verify/tag, release, merge qua API, gh api ghi, in token, sửa settings và hook", Mọi lần gọi trong lane, "KIT_LANE (superadvisor đặt), KIT_PROTECTED_BRANCHES"]
          - [metrics-subagent, "Không chặn; ghi mỗi lượt subagent", Mỗi lần subagent dừng, "—"]
          - [metrics-main, "Không chặn; ghi phiên chính theo model", Mỗi Stop, "KIT_METRICS_MAIN_MAX_FIRST_BYTES (mặc định 20 MB)"]

  - type: section
    title: 4. Cổng tải máy
    blocks:
      - type: code
        language: bash
        title: kit-load
        text: |
          kit-load            # exit 0 OK · 1 WARN · 2 STOP
          kit-load --json     # cho script
          lane-launch ... --force-load   # mở dù STOP, ghi log load-force
      - type: table
        columns: [Đo, Ghi chú]
        rows:
          - [RAM trống %, Mỗi lane là một phiên Claude Code cộng công cụ]
          - [Swap, "Chỉ STOP khi RAM trống < 30% hoặc memory pressure ≥ 2"]
          - [Load / nhân, Build và test nhiều lane cùng lúc]
          - [Đĩa trống, "Dưới 40 GB thì leader được nhắc sweep worktree"]
          - [Simulator đang Booted, Chỉ một iOS simulator cùng lúc]
          - [Colima rảnh, VM Docker không container vẫn giữ RAM]

  - type: section
    title: 5. Lane tự báo, watcher
    blocks:
      - type: code
        language: bash
        title: Watcher
        text: |
          kit-tmux lanes watcher status
          kit-tmux lanes watcher start
          kit-tmux lanes watcher stop
      - type: table
        columns: [Sự kiện, Từ đâu, Leader thấy]
        rows:
          - [DONE, Hook Stop có dòng READY, "Tin READY kèm PR và sha"]
          - [IDLE, Hook idle_prompt, "Rỗi > 10 phút"]
          - [WAITING, Hộp hỏi quyền, "Leo thang nếu ≥ 15′ và 15′ sau vẫn chưa xử lý"]
          - [EXIT, Hook SessionEnd, "DEAD / mồ côi"]
          - [LIMIT, Hết lượt hoặc lỗi auth, Báo ngay]

  - type: section
    title: 6. Reuse, pool, dọn dẹp, adopt, vai
    blocks:
      - type: code
        language: bash
        title: Lane
        text: |
          kit-tmux lanes reuse <lane> <brief>     # cùng repo + account, /clear rồi gõ brief
          kit-tmux lanes adopt <tên> --sock <s>   # chỉ lead; tên <PROJ>-C<n>-<thẻ>
          lane-launch ... --new                   # bỏ qua pool (lane_pool mặc định 3, đầy thì exit 4)
          kit-context settings | check            # in và kiểm manifest vai
      - type: code
        language: bash
        title: Dọn worktree
        text: |
          kit-wt-clean --self --light            # lane, trước READY: xoá thư mục build nặng
          kit-wt-clean --self --apply            # lane tự xoá worktree của mình khi an toàn
          kit-wt-clean --sweep --apply           # chỉ lead, chỉ khi đĩa trống < 40 GB
          lane-status --clean --apply
      - type: checklist
        items:
          - text: Không tiến trình nào có cwd trong worktree
          - text: Worktree sạch và đã push
          - text: Không locked, không dùng --force
          - text: PR CLOSED thì giữ; lỗi khi kiểm thì giữ

  - type: section
    title: 7. Biến môi trường và brains
    blocks:
      - type: table
        columns: [Biến, Mặc định, Ý nghĩa]
        rows:
          - [SA_PROJECT, thư mục hiện tại, Thư mục project]
          - [SA_SOCKET, sa, "Tên socket tmux, để phiên của kit tách khỏi phiên của bạn"]
          - [KIT_LANE, "1 trong lane", "Bật owner-guard"]
          - [KIT_ROLE, "lead nếu không đặt", "AgentAutoKit. lane: chỉ nạp context an toàn, thêm deny chống thoát vai"]
          - [FULL_SUITE_OK, "—", "=1 để test-budget cho chạy cả bộ test"]
      - type: code
        language: bash
        title: Chi phí và token
        text: |
          plugin/scripts/kit-stats.sh
          plugin/scripts/token-watch.sh --hours 24
      - type: table
        columns: [Đường dẫn, Nội dung]
        rows:
          - [brains/lead.md, "Leader tự làm gì, hỏi bạn gì, không bao giờ làm gì"]
          - [brains/config.json, "integration_branch, ngưỡng patrol (waiting_min, stuck_min, idle_close_min)"]
          - [brains/decisions.md, "Quyết định đã có, để leader không hỏi hai lần"]
          - [brains/inbox/, Việc mới thả vào cho leader]
          - [brains/.local/, "Dữ liệu runtime: brief, patrol log, review buổi tối, log cron. Bị git-ignore."]
          - [.claude/context-roles.json, "AgentAutoKit. Manifest vai: lead_only, safety, lane_deny"]
