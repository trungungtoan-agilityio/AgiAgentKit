version: 1
meta:
  title: Session Superadvisor — talk handout
  description: Companion to the Session Superadvisor talk — the problem, the owner/leader/lanes/brains architecture, one card's lifecycle, the lane lifecycle (load gate, self-reporting, reuse, cleanup, adopt), roles and hooks, model routing and token measurement, gated epic merges, spec by prototype and how to install.
  locale: en
theme:
  preset: paper-ink
blocks:
  - type: hero
    eyebrow: Talk handout · Session Superadvisor
    title: One leader session runs many Claude Code lanes
    description: "With guardrails and token telemetry built in, and lanes that open safely, report back by themselves and clean up after the card. You talk to one session; the others report to it."

  - type: section
    title: The problem
    blocks:
      - type: card-grid
        items:
          - title: You are the bottleneck
            text: Every session asks for approval or direction. Step away and everything stops.
          - title: Stuck sessions go unseen
            text: A permission prompt open since noon, a lane looping on one error — unnoticed until evening.
          - title: Long sessions burn tokens
            text: Each turn re-reads the whole context. The longer the session, the pricier every question.
      - type: text
        text: "A fourth pain appears once many lanes run at once: the machine runs out of RAM or disk. The lane lifecycle below handles that."

  - type: section
    title: Architecture — owner, leader, lanes, brains, hooks, metrics
    blocks:
      - type: text
        text: "The leader assigns work, unblocks lanes and merges within the limits you set. You decide product, production and permissions. A lane is a Claude Code session in its own git worktree and tmux session, one per medium card or hard bug."
      - type: image
        src: ../img/architecture.svg
        alt: "Architecture: the owner talks to the leader over Remote Control; brains alert the leader when a lane is stuck; the leader does small cards itself and opens a lane per medium card (sonnet builder + one opus review) and the hard bug (opus); hooks see every tool call and log token metrics."
        caption: "Owner drives the leader from the phone over Remote Control. The leader opens lanes; hooks watch every tool call and log token metrics; brains patrol and report back to the leader."
      - type: table
        title: Four roles, each knows what is not its job
        columns: [Role, Does, Never does]
        rows:
          - [Owner, "Decides product; approves merges to the integration branch, production, permissions", Hand-feed work to each lane]
          - [Leader, "Sizes the backlog, writes briefs, opens and reuses lanes, unblocks, merges within limits", Write large blocks of code itself]
          - [Lane, "One card, one worktree, one PR; reports READY by itself", "Merge, push to main, release or change permissions — hooks block it"]
          - [Brains, "15-minute patrol, nightly review, morning report", Become a second chat channel]
      - type: diagram-panel
        title: The leader's loop, after every event
        caption: Never just wait — waiting on review? Give another lane work.
        spec:
          meta:
            title: The leader's loop
          nodes:
            - { id: unblock, label: "1. Unblock first" }
            - { id: merge, label: "2. Merge ready PRs" }
            - { id: assign, label: "3. Assign idle lanes" }
            - { id: cleanup, label: "4. Clean up" }
            - { id: report, label: "5. Report briefly" }
          connections:
            - { from: unblock, to: merge, label: "narrower brief, reopen lane" }
            - { from: merge, to: assign, label: only within owner limits }
            - { from: assign, to: cleanup, label: "reuse idle lanes; never two lanes on the same files" }
            - { from: cleanup, to: report, label: "close or reuse lane, drop safe worktrees" }

  - type: section
    title: One card, from brief to merge (card C3 of the demo)
    blocks:
      - type: diagram-panel
        title: Sequence of one card
        spec:
          meta:
            title: One card from brief to merge
          nodes:
            - { id: init, label: superadvisor init }
            - { id: up, label: superadvisor up }
            - { id: brief, label: Leader writes the brief }
            - { id: lane, label: superadvisor lane open c3 }
            - { id: pr, label: Lane opens a PR }
            - { id: approve, label: "Owner says M 12" }
            - { id: merged, label: Leader merges }
            - { id: close, label: superadvisor lane close c3 }
          connections:
            - { from: init, to: up, label: once per project }
            - { from: up, to: brief, label: you give it work }
            - { from: brief, to: lane, label: size M card }
            - { from: lane, to: pr, label: tests from the brief green }
            - { from: pr, to: approve, label: report in five lines }
            - { from: approve, to: merged, label: "same head, no High/Critical" }
            - { from: merged, to: close, label: "--rm-worktree" }
      - type: steps
        items:
          - title: Set up the project once
            text: "`superadvisor init ~/demo-library` copies the template (rules, `brains/`, a `CLAUDE.md` block) without overwriting anything."
          - title: Start the leader
            text: "`superadvisor up ~/demo-library` starts tmux session `DEMO-LIBRARY-LEAD` on socket `sa`, in auto mode with Remote Control."
          - title: Give the leader work
            text: "For example: read BACKLOG.md, size each card, open a lane for C3. The leader writes one brief per M card; size S cards (1–3 files) it does itself."
          - title: Open the lane
            text: "`superadvisor lane open c3 --brief /path/to/c3-brief.md` creates worktree `.claude/worktrees/c3`, branch `lane/c3` and session `DEMO-LIBRARY-C3` with `KIT_LANE=1`."
          - title: Watch
            text: "`superadvisor status` prints BUSY, IDLE, WAITING or DEAD per session. `superadvisor patrol` flags a prompt waiting ≥ 5 minutes or a screen unchanged ≥ 20 minutes."
          - title: The PR
            text: "The lane runs the brief's test command, pushes its branch, opens a PR against the integration branch, prints a READY line and stops. It cannot merge."
          - title: Merge
            text: "You answer `M 12`. The leader merges only the approved head, with green tests on it and no High/Critical findings after at most two review rounds. Inside an epic the gate below replaces your word."
          - title: Close and report
            text: "`superadvisor lane close c3 --rm-worktree` (or reuse the lane for the next card), then `superadvisor report`: sessions, stuck flags, today's commits and estimated cost."

  - type: section
    title: Lane states
    blocks:
      - type: diagram-panel
        title: A lane from open to auto-close
        caption: "DEAD (Claude Code exited) and WAITING (permission prompt) can happen at any point; patrol flags them. `patrol --clean --apply` closes only lanes IDLE for `idle_close_min` (30), merged, clean and pushed."
        spec:
          meta:
            title: Lane states
          nodes:
            - { id: open, label: lane open }
            - { id: busy, label: BUSY }
            - { id: idle, label: IDLE }
            - { id: closed, label: closed or reused }
          connections:
            - { from: open, to: busy, label: "tmux session starts, KIT_LANE=1" }
            - { from: busy, to: idle, label: "PR open, lane stops" }
            - { from: idle, to: closed, label: "patrol --clean --apply, or reuse" }
      - type: table
        title: How each state is detected
        columns: [State, Detected when]
        rows:
          - [DEAD, "tmux reports the pane as dead: Claude Code exited (panes are kept with remain-on-exit)"]
          - [WAITING, "The last 15 non-empty lines contain a permission prompt"]
          - [BUSY, "The last 15 non-empty lines contain esc to interrupt, ctrl+c to interrupt, or a spinner line"]
          - [IDLE, "None of the above: finished, or waiting for input"]

  - type: section
    title: A lane's life in five steps
    blocks:
      - type: steps
        items:
          - title: 1. Gate
            text: "`kit-load` measures free RAM, swap, load per core, free disk, booted simulators and idle Colima. Exit 0/1/2 = OK/WARN/STOP, `--json` for scripts. STOP refuses `lane-launch`, `lane-resume` and `--bare` (logged `load-refused`); `--force-load` opens anyway and logs `load-force`. Opening the leader only warns. Swap alone does not stop lanes: STOP needs free RAM under 30% or high memory pressure. The same probe feeds lead-patrol, and a load-hint hook adds context before `lanes reuse` and session resume; it never blocks."
          - title: 2. Run in role
            text: "The lane starts with `KIT_ROLE=lane`: it loads the safe core and the app's rules, never files marked `lead_only`, and hits hard denies for merge, push to main, force, tag, deploy and settings or hooks edits."
          - title: 3. Report back
            text: "Stop, SessionEnd and idle hooks call `bin/lane-event`, which appends one line to `lane-events.jsonl` (DONE, IDLE, WAITING, EXIT or LIMIT, with the PR and sha from the READY line). A watcher per leader turns them into inbox messages."
          - title: 4. Reuse
            text: "`kit-tmux lanes reuse <lane> <brief>` hands the next brief to an idle lane of the same repo and account. New lanes first look for an idle one in the pool (`lane_pool`, default 3); `--new` skips the pool."
          - title: 5. Clean up
            text: "Before READY the lane runs `kit-wt-clean --self --light` to drop heavy build folders. The leader sweeps worktrees only when free disk is under 40 GB, and only clean, pushed, unlocked worktrees that no process uses; closed PRs stay. Any error while checking keeps the worktree."
      - type: callout
        tone: info
        title: "Lanes from your own scripts: kit-tmux lanes adopt"
        text: "Projects that open lanes with their own launcher can register them: `kit-tmux lanes adopt <name> --sock <socket>` writes the running lane into the leader's book and starts the watcher. Leader only; the name must match `<PROJ>-C<n>-<tag>` and the tmux session must exist."

  - type: section
    title: Lanes report to the leader by themselves
    blocks:
      - type: image
        src: ../img/stuck-lane.svg
        alt: "Stuck lane: patrol flags WAITING ≥ 5 min, DEAD, or a screen unchanged ≥ 20 min, and only reports. Owner permission needed: tell the owner. Otherwise close the lane, narrow the brief, reopen it. Stuck twice: ask the owner."
        caption: "How the leader handles a stuck lane (diagram labels in Vietnamese). The lane-event watcher below gets the news to the leader sooner."
      - type: diagram-panel
        title: From lane hook to leader
        caption: "Messages are marked unverified and never treated as the owner's words. An idle leader gets at most one typed `[kit-lane-event]` line every 5 minutes."
        spec:
          meta:
            title: Lane events
          nodes:
            - { id: hooks, label: "Lane hooks (Stop, SessionEnd, idle)" }
            - { id: log, label: lane-events.jsonl }
            - { id: watcher, label: "Watcher (≈60 s, flock)" }
            - { id: inbox, label: "Leader inbox + lead-nudge" }
            - { id: alert, label: "Alert + owner-alerts.log" }
          connections:
            - { from: hooks, to: log, label: "DONE IDLE WAITING EXIT LIMIT" }
            - { from: log, to: watcher, label: read every pass }
            - { from: watcher, to: inbox, label: "READY, IDLE > 10′, stuck, DEAD" }
            - { from: inbox, to: alert, label: "still unhandled 15′ later" }
      - type: table
        title: What the watcher flags
        columns: [Event, Meaning]
        rows:
          - [READY, A new READY PR line in the lane]
          - [IDLE, Idle for more than 10 minutes]
          - [stuck / WAITING, Screen unchanged or a prompt waiting]
          - [DEAD / orphan, "Claude Code exited, or a lane no leader owns (patrol prints the close command, never runs it)"]
          - [LIMIT / auth, Usage limit or login problem]
      - type: text
        text: "Escalation: stuck, DEAD or WAITING for 15 minutes and still unhandled 15 minutes after the message → an alert message, a line in `~/.kit-remote/owner-alerts.log`, and lead-patrol shows `VIỆC: lane-kẹt` until it is resolved. Control the watcher with `kit-tmux lanes watcher status|start|stop`. The 15-minute patrol stays as a safety net."

  - type: section
    title: Lane and leader load different context
    blocks:
      - type: table
        columns: ["", "Lane (KIT_ROLE=lane)", Leader]
        rows:
          - [Loads, "Safe core + the app's rules; lead_only files left out", Everything (also the default when no role is set)]
          - [Safety floor, "Files named safety, secret, security, tenant or permission always load", Same]
          - [Hard denies, "Merge, push to main, force, tag, deploy, edit settings, hooks or the manifest", —]
          - [Anti-escape, "No git remote/config edits, no tmux or new lanes, no gh api writes, no credential reads", —]
          - [Lead-only commands, "Refused: the guard walks the process tree and fails closed", Allowed]
      - type: text
        text: "The manifest is `.claude/context-roles.json` (`lead_only`, `safety`, `lane_deny`); `kit-context settings|check` prints and validates it, and a broken manifest stops the lane from opening. Denies are a second net; the real lock is hooks plus branch protection."

  - type: section
    title: Guardrails live in hooks
    blocks:
      - type: table
        columns: [Hook, Does, Threshold]
        rows:
          - [turn-guard, "Denies long builder/tester runs (Read, Grep still pass); a named agent is matched by its real type", "Warn 60 and 90, deny from 130"]
          - [agent-routing, Denies model overrides and generic agents, Every Agent call]
          - [test-budget, "Denies whole-suite test runs, also behind timeout, nice or sudo", "Unless FULL_SUITE_OK=1"]
          - [owner-guard, "Denies merges, pushes to protected branches, force/mirror/delete/tag pushes, --no-verify, releases, API merges, gh api writes, token printing, edits to settings and hooks", "In lanes (KIT_LANE=1)"]
          - [metrics-subagent, Logs only — tokens per subagent run, Each subagent stop]
          - [metrics-main, "Logs only — main-session tokens per model, read with a byte cursor", Each Stop]
      - type: text
        text: "Four hooks deny with guidance (never a prompt in auto mode), two only log. Quoted prose in commit messages does not trip owner-guard; `KIT_PROTECTED_BRANCHES` adds the integration branch to the protected list. Every threshold is tunable with an environment variable."

  - type: section
    title: Model routing and measuring tokens
    blocks:
      - type: table
        title: Five agents, each pinned to a model
        columns: [Agent, Model, When]
        rows:
          - [scout, haiku, "Find files, look things up, summarize code"]
          - [builder, sonnet, "Known-cause changes across 1–5 files"]
          - [tester, sonnet, Write and fix tests]
          - [reviewer, opus, One review round before the PR]
          - [debugger, opus, "Unknown root cause, a test red twice"]
      - type: text
        text: "Route by difficulty, not size: a two-file change with an unknown cause still goes to the debugger. `agent-routing` rejects a model parameter at call time. Kit price table: sonnet ≈ 2× haiku, opus ≈ 4× haiku."
      - type: stats
        title: Measure the main session, not just subagents (internal measurements on a real project, anonymized, API list prices)
        items:
          - label: Tokens spent in the main session — the part nobody measured
            value: "~70%"
          - label: Subagent runs over 100 turns per week, after turning on turn-guard
            value: "153 → 0"

  - type: section
    title: Benchmark
    blocks:
      - type: callout
        tone: warning
        title: N = 1 per card
        text: "One run per card per mode on the six cards of `demo-app/BACKLOG.md`, so treat the spread as unknown. Both modes ran headless with project settings only."
      - type: benchmark-comparison
        title: "Baseline (one Opus session) vs superadvisor (Sonnet leader + tiered agents)"
        baseline:
          label: "baseline: one Opus session"
        candidate:
          label: "superadvisor: Sonnet leader + tiered agents"
        metrics:
          - label: Cards passed
            baseline: 6
            candidate: 6
            better: higher
            format: integer
          - label: Cost per card (USD)
            baseline: 0.292
            candidate: 0.270
            better: lower
            format: number
            decimals: 3
          - label: Wall time per card (s)
            baseline: 66
            candidate: 62
            better: lower
            format: integer
        method: "One run per card per mode on the six demo cards; `Cost USD` is `total_cost_usd` reported by Claude Code; wall time is the full `claude -p` run."
        limitations: "N = 1. The demo app is small, so the leader's advantage is small; coordination pays off on longer sessions and parallel lanes. Headless runs cannot measure how often a human had to step in."
        source:
          label: bench/results.md
          href: ../../../bench/results.md
      - type: chart
        kind: bar
        title: Cost per card (USD)
        labels: [C1, C2, C3, C4, C5, C6]
        series:
          - label: baseline
            values: [0.397, 0.216, 0.346, 0.330, 0.253, 0.214]
          - label: superadvisor
            values: [0.282, 0.129, 0.515, 0.244, 0.215, 0.236]
        y:
          label: USD
          format: number
          decimals: 3
      - type: list
        title: What this shows
        items:
          - text: Same pass rate on the hidden acceptance tests (6/6 in both modes).
          - text: Superadvisor cost 92% of baseline.
          - text: Wall time was about the same.

  - type: section
    title: The leader merges into epic branches, behind a gate
    blocks:
      - type: checklist
        items:
          - text: "Base is epic/<slug>-<issue> — never the integration branch, a release branch or anything that deploys."
          - text: Not a draft, not from a fork, opened by the project's author.
          - text: "Checks green, a Gate: line and Review: HEAD <sha40> · High 0 · Critical 0 for the same head being merged."
          - text: "No sensitive paths: dot-folders, CLAUDE.md, scripts, hooks, settings, deploy files and lockfiles go to the owner."
          - text: "No deploy trigger: workflow on: keys checked on every branch involved."
      - type: callout
        tone: warning
        title: On by default, fails closed
        text: "The line `Epic lead-merge: off` in `CLAUDE.md` on the integration branch (read from origin after a fetch) turns it off; a read error counts as off. Changing that line must be its own PR merged by the owner. Merges into the integration branch always wait for the owner."

  - type: section
    title: Spec by prototype, before any code
    blocks:
      - type: card-grid
        items:
          - title: Guide
            text: Demo script plus a UAT checklist that ticks itself as you click through.
          - title: App
            text: Phone frame with tabs and bottom sheets.
          - title: Web
            text: Responsive layout sharing the same cart.
          - title: Staff / POS
            text: Order queue and scan.
          - title: Admin
            text: KPI, orders, catalog and audit.
      - type: text
        text: "The `ui-prototype` skill has a multi-screen template in one HTML file. Sample flow: order in App or Web → Staff queue → complete → Admin KPI and audit update. Keep only the screens the feature needs, fill the TODO domain markers, use made-up data only, and link the prototype in the GitHub issue as the behavior spec."

  - type: section
    title: What runs on a schedule
    blocks:
      - type: timeline
        title: "superadvisor cron --install"
        items:
          - when: Every 15 minutes
            title: "patrol --clean --apply"
            text: Status of every session, stuck flags, and auto-close of idle merged lanes.
          - when: "22:00"
            title: review
            text: "Read-only nightly review saved to `brains/.local/reviews/<date>.md`: open PRs, lanes, today's stuck flags, commits, estimated cost."
          - when: "08:00"
            title: report
            text: "Short daily report: lanes, stuck flags, commits, estimated cost. launchd logs go to `~/Library/Logs`."

  - type: section
    title: Install
    blocks:
      - type: code
        language: bash
        title: Install
        text: |
          git clone https://github.com/trungungtoan-agilityio/AgiAgentKit
          claude plugin marketplace add ./AgiAgentKit
          claude plugin install agi-agent-kit@agi-agent-kit
          AgiAgentKit/bin/superadvisor init /path/to/project
          AgiAgentKit/bin/superadvisor up /path/to/project
          AgiAgentKit/bin/superadvisor cron --install --project /path/to/project
      - type: text
        text: "AgiAgentKit (MIT) gives you five tiered agents, six hooks, the superadvisor CLI with cron, a sample library-loans app with a six-card backlog and the benchmark. The load gate, watcher, lane reuse, role-scoped context, epic merge gate and prototype template ship in AgentAutoKit with its agent-brains plugin. Needs Claude Code, tmux, jq, git, and Node 20 for the sample app."

  - type: section
    title: More documents
    blocks:
      - type: references
        items:
          - { id: qa, title: "Q&A and discussion prep (Vietnamese)", href: qa.html }
          - { id: cheatsheet, title: "Command cheat sheet (Vietnamese)", href: cheatsheet.html }
          - { id: lifecycle, title: Lifecycle of one card, href: ../../lifecycle.md }
          - { id: faq, title: FAQ, href: ../../faq.md }
          - { id: reference, title: "Reference: commands, agents, hooks", href: ../../reference.md }
          - { id: install, title: Install guide, href: ../../INSTALL.md }
          - { id: bench, title: Benchmark results, href: ../../../bench/results.md }
