<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 640" width="500" height="640" role="img" aria-labelledby="t d" lang="vi">
<title id="t">Lane bị kẹt thì làm gì</title>
<desc id="d">Patrol gắn cờ KẸT nhưng không hành động. Ba trường hợp: WAITING một hộp hỏi quyền từ 5 phút, DEAD khi pane chết, hoặc màn hình không đổi từ 20 phút. Hộp hỏi quyền chỉ owner duyệt được thì leader báo owner. Các trường hợp còn lại leader đóng lane, viết brief hẹp hơn và mở lại cùng tên. Kẹt lần hai thì dừng và hỏi owner.</desc>
<style>
svg{--surface:#fbf9f4;--ink:#1a1e23;--ink2:#464e58;--ground:#ddd6c6;--grid:#cfc7b5;--leader:#2f6f8f;--lane:#8794a2;--brains:#7656a3;--metrics:#2a8768;--owner:#c4612c;--gate:#d29a22;--clock:#6b7a4c;--sonnet:#4a6bd0;--opus:#c8433a;--dead:#5d6168;--bad:#c2392f}
@media (prefers-color-scheme: dark){svg{--surface:#171c21;--ink:#e8e5dd;--ink2:#b4b8bd;--ground:#232a30;--grid:#2d353c;--leader:#3f8bb0;--lane:#5f6d7b;--brains:#8a6cc0;--metrics:#2f9c78;--owner:#dd7840;--gate:#e0ab35;--clock:#8a9c62;--sonnet:#6b88e6;--opus:#e05a4f;--dead:#7b8089;--bad:#ff6a5e}}
.ground{fill:var(--ground);stroke:var(--grid);stroke-width:1.5}
.edge{fill:none;stroke:var(--ink2);stroke-width:2.2;stroke-linejoin:round}
.dash{stroke-dasharray:6 5}
#arrow path{fill:var(--ink2)}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.lbl{font-size:16px;font-weight:650;fill:var(--ink)}
.sub{font-size:13.5px;fill:var(--ink2)}
.elbl{font-size:13px;font-style:italic;fill:var(--ink2)}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z"/></marker></defs>
<g><polygon points="-1.1,352.5 250.0,70.0 501.1,352.5 250.0,635.0" class="ground"/></g>
<g><path d="M250.0,134.0 L250.0,174.0 L102.8,174.0 L102.8,219.0" class="edge" marker-end="url(#arrow)"/><path d="M250.0,134.0 L250.0,174.0 L250.0,174.0 L250.0,219.0" class="edge" marker-end="url(#arrow)"/><path d="M250.0,134.0 L250.0,174.0 L397.2,174.0 L397.2,219.0" class="edge" marker-end="url(#arrow)"/><path d="M102.8,304.0 L102.8,404.0" class="edge" marker-end="url(#arrow)"/><path d="M102.8,329.0 L258.7,329.0 L258.7,401.5" class="edge" marker-end="url(#arrow)"/><path d="M250.0,304.0 L250.0,316.5 L284.6,316.5 L284.6,401.5" class="edge" marker-end="url(#arrow)"/><path d="M397.2,304.0 L397.2,316.5 L310.6,316.5 L310.6,401.5" class="edge" marker-end="url(#arrow)"/><path d="M284.6,439.0 L284.6,543.0" class="edge" marker-end="url(#arrow)"/></g>
<g><g><polygon points="198.0,115.0 250.0,145.0 250.0,109.0 198.0,79.0" style="fill:color-mix(in srgb,var(--clock) 74%,#000)"/><polygon points="250.0,145.0 302.0,115.0 302.0,79.0 250.0,109.0" style="fill:color-mix(in srgb,var(--clock) 86%,#000)"/><polygon points="250.0,49.0 302.0,79.0 250.0,109.0 198.0,79.0" style="fill:var(--clock)"/></g><g><polygon points="59.5,235.0 102.8,260.0 102.8,232.0 59.5,207.0" style="fill:color-mix(in srgb,var(--gate) 74%,#000)"/><polygon points="102.8,260.0 146.1,235.0 146.1,207.0 102.8,232.0" style="fill:color-mix(in srgb,var(--gate) 86%,#000)"/><polygon points="102.8,182.0 146.1,207.0 102.8,232.0 59.5,207.0" style="fill:var(--gate)"/></g><g><polygon points="206.7,235.0 250.0,260.0 250.0,232.0 206.7,207.0" style="fill:color-mix(in srgb,var(--dead) 74%,#000)"/><polygon points="250.0,260.0 293.3,235.0 293.3,207.0 250.0,232.0" style="fill:color-mix(in srgb,var(--dead) 86%,#000)"/><polygon points="250.0,182.0 293.3,207.0 250.0,232.0 206.7,207.0" style="fill:var(--dead)"/></g><g><polygon points="353.9,235.0 397.2,260.0 397.2,232.0 353.9,207.0" style="fill:color-mix(in srgb,var(--sonnet) 74%,#000)"/><polygon points="397.2,260.0 440.5,235.0 440.5,207.0 397.2,232.0" style="fill:color-mix(in srgb,var(--sonnet) 86%,#000)"/><polygon points="397.2,182.0 440.5,207.0 397.2,232.0 353.9,207.0" style="fill:var(--sonnet)"/></g><g><ellipse cx="102.8" cy="421.0" rx="13" ry="6" fill="#000" fill-opacity="0.16"/><path d="M92.8,420.0 Q91.8,393.0 102.8,392.0 Q113.8,393.0 112.8,420.0 Z" style="fill:var(--owner)"/><circle cx="102.8" cy="383.0" r="8.5" style="fill:color-mix(in srgb,var(--owner) 70%,#fff)"/><rect x="110.8" y="393.0" width="9" height="15" rx="2" transform="rotate(-14 114.8 401.0)" style="fill:var(--ink)"/></g><g><polygon points="232.7,420.0 284.6,450.0 284.6,410.0 232.7,380.0" style="fill:color-mix(in srgb,var(--leader) 74%,#000)"/><polygon points="284.6,450.0 336.6,420.0 336.6,380.0 284.6,410.0" style="fill:color-mix(in srgb,var(--leader) 86%,#000)"/><polygon points="284.6,350.0 336.6,380.0 284.6,410.0 232.7,380.0" style="fill:var(--leader)"/></g><g><polygon points="237.9,560.0 284.6,587.0 284.6,557.0 237.9,530.0" style="fill:color-mix(in srgb,var(--bad) 74%,#000)"/><polygon points="284.6,587.0 331.4,560.0 331.4,530.0 284.6,557.0" style="fill:color-mix(in srgb,var(--bad) 86%,#000)"/><polygon points="284.6,503.0 331.4,530.0 284.6,557.0 237.9,530.0" style="fill:var(--bad)"/></g></g>
<g><text x="111.4" y="364.0" class="elbl" text-anchor="start">quyền của owner</text><text x="128.8" y="325.0" class="elbl" text-anchor="start">không phải quyền owner</text><text x="276.0" y="494.0" class="elbl" text-anchor="end">vẫn kẹt</text><text x="250.0" y="22.0" class="lbl" text-anchor="middle">patrol gắn cờ KẸT</text><text x="250.0" y="39.0" class="sub" text-anchor="middle">chỉ báo, không hành động</text><text x="102.8" y="280.0" class="lbl" text-anchor="middle">WAITING</text><text x="102.8" y="297.0" class="sub" text-anchor="middle">≥ 5 phút</text><text x="250.0" y="280.0" class="lbl" text-anchor="middle">DEAD</text><text x="250.0" y="297.0" class="sub" text-anchor="middle">pane chết</text><text x="397.2" y="280.0" class="lbl" text-anchor="middle">Không đổi</text><text x="397.2" y="297.0" class="sub" text-anchor="middle">≥ 20 phút</text><text x="102.8" y="446.0" class="lbl" text-anchor="middle">Báo owner</text><text x="102.8" y="463.0" class="sub" text-anchor="middle">duyệt quyền</text><text x="344.6" y="388.0" class="lbl" text-anchor="start">Đóng lane,</text><text x="344.6" y="405.0" class="sub" text-anchor="start">brief hẹp hơn,</text><text x="344.6" y="422.0" class="sub" text-anchor="start">mở lại cùng tên</text><text x="284.6" y="607.0" class="lbl" text-anchor="middle">Kẹt lần hai</text><text x="284.6" y="624.0" class="sub" text-anchor="middle">dừng và hỏi owner</text></g>
</svg>
