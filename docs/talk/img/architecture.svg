<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 680" width="500" height="680" role="img" aria-labelledby="t d" lang="en">
<title id="t">Superadvisor architecture</title>
<desc id="d">The owner talks to the leader session from the phone over Remote Control. Brains (patrol, nightly review, morning report) alert the leader when a lane is stuck. The leader sends a brief to three lanes, with a model chosen by task size: small (sonnet), medium (sonnet builder plus one opus review round) and hard bug (opus). Every tool call in every lane goes through the hooks, which write token counts to the metrics read by kit-stats.</desc>
<style>
svg{--surface:#fbf9f4;--ink:#1a1e23;--ink2:#464e58;--ground:#ddd6c6;--grid:#cfc7b5;--leader:#2f6f8f;--lane:#8794a2;--brains:#7656a3;--metrics:#2a8768;--owner:#c4612c;--gate:#d29a22;--clock:#6b7a4c;--sonnet:#4a6bd0;--opus:#c8433a;--dead:#5d6168;--bad:#c2392f}
@media (prefers-color-scheme: dark){svg{--surface:#171c21;--ink:#e8e5dd;--ink2:#b4b8bd;--ground:#232a30;--grid:#2d353c;--leader:#3f8bb0;--lane:#5f6d7b;--brains:#8a6cc0;--metrics:#2f9c78;--owner:#dd7840;--gate:#e0ab35;--clock:#8a9c62;--sonnet:#6b88e6;--opus:#e05a4f;--dead:#7b8089;--bad:#ff6a5e}}
.ground{fill:var(--ground);stroke:var(--grid);stroke-width:1.5}
.edge{fill:none;stroke:var(--ink2);stroke-width:2.2;stroke-linejoin:round}
.dash{stroke-dasharray:6 5}
#arrow path{fill:var(--ink2)}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.lbl{font-size:16px;font-weight:650;fill:var(--ink)}
.sub{font-size:13.5px;fill:var(--ink2)}
.elbl{font-size:13px;font-style:italic;fill:var(--ink2)}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z"/></marker></defs>
