<g><path d="M120.1,134.0 L120.1,249.0 L210.2,249.0" class="edge dash" marker-end="url(#arrow)"/><path d="M388.6,134.0 L388.6,249.0 L289.8,249.0" class="edge" marker-end="url(#arrow)"/><path d="M250.0,269.0 L250.0,311.5 L102.8,311.5 L102.8,361.5" class="edge" marker-end="url(#arrow)"/><path d="M250.0,269.0 L250.0,311.5 L250.0,311.5 L250.0,361.5" class="edge" marker-end="url(#arrow)"/><path d="M250.0,269.0 L250.0,311.5 L397.2,311.5 L397.2,361.5" class="edge" marker-end="url(#arrow)"/><path d="M102.8,441.5 L102.8,489.0 L250.0,489.0 L250.0,511.5" class="edge" marker-end="url(#arrow)"/><path d="M250.0,441.5 L250.0,489.0 L250.0,489.0 L250.0,511.5" class="edge" marker-end="url(#arrow)"/><path d="M397.2,441.5 L397.2,489.0 L250.0,489.0 L250.0,511.5" class="edge" marker-end="url(#arrow)"/><path d="M250.0,539.0 L250.0,584.0" class="edge" marker-end="url(#arrow)"/></g>
<g><g><ellipse cx="120.1" cy="116.0" rx="13" ry="6" fill="#000" fill-opacity="0.16"/><path d="M110.1,115.0 Q109.1,88.0 120.1,87.0 Q131.1,88.0 130.1,115.0 Z" style="fill:var(--owner)"/><circle cx="120.1" cy="78.0" r="8.5" style="fill:color-mix(in srgb,var(--owner) 70%,#fff)"/><rect x="128.1" y="88.0" width="9" height="15" rx="2" transform="rotate(-14 132.1 96.0)" style="fill:var(--ink)"/></g><g><polygon points="340.1,115.0 388.6,143.0 388.6,109.0 340.1,81.0" style="fill:color-mix(in srgb,var(--brains) 74%,#000)"/><polygon points="388.6,143.0 437.1,115.0 437.1,81.0 388.6,109.0" style="fill:color-mix(in srgb,var(--brains) 86%,#000)"/><polygon points="388.6,53.0 437.1,81.0 388.6,109.0 340.1,81.0" style="fill:var(--brains)"/></g><g><polygon points="189.4,250.0 250.0,285.0 250.0,233.0 189.4,198.0" style="fill:color-mix(in srgb,var(--leader) 74%,#000)"/><polygon points="250.0,285.0 310.6,250.0 310.6,198.0 250.0,233.0" style="fill:color-mix(in srgb,var(--leader) 86%,#000)"/><polygon points="250.0,163.0 310.6,198.0 250.0,233.0 189.4,198.0" style="fill:var(--leader)"/></g><g><polygon points="57.7,380.0 102.8,406.0 102.8,376.0 57.7,350.0" style="fill:color-mix(in srgb,var(--sonnet) 74%,#000)"/><polygon points="102.8,406.0 147.8,380.0 147.8,350.0 102.8,376.0" style="fill:color-mix(in srgb,var(--sonnet) 86%,#000)"/><polygon points="102.8,324.0 147.8,350.0 102.8,376.0 57.7,350.0" style="fill:var(--sonnet)"/></g><g><polygon points="205.0,380.0 250.0,406.0 250.0,376.0 205.0,350.0" style="fill:color-mix(in srgb,var(--sonnet) 74%,#000)"/><polygon points="250.0,406.0 295.0,380.0 295.0,350.0 250.0,376.0" style="fill:color-mix(in srgb,var(--sonnet) 86%,#000)"/><polygon points="250.0,324.0 295.0,350.0 250.0,376.0 205.0,350.0" style="fill:var(--sonnet)"/></g><g><polygon points="352.2,380.0 397.2,406.0 397.2,376.0 352.2,350.0" style="fill:color-mix(in srgb,var(--opus) 74%,#000)"/><polygon points="397.2,406.0 442.3,380.0 442.3,350.0 397.2,376.0" style="fill:color-mix(in srgb,var(--opus) 86%,#000)"/><polygon points="397.2,324.0 442.3,350.0 397.2,376.0 352.2,350.0" style="fill:var(--opus)"/></g><g><polygon points="198.0,530.0 250.0,560.0 250.0,546.0 198.0,516.0" style="fill:color-mix(in srgb,var(--gate) 74%,#000)"/><polygon points="250.0,560.0 302.0,530.0 302.0,516.0 250.0,546.0" style="fill:color-mix(in srgb,var(--gate) 86%,#000)"/><polygon points="250.0,486.0 302.0,516.0 250.0,546.0 198.0,516.0" style="fill:var(--gate)"/></g><g><path d="M218.2,571.0 L218.2,605.0 A31.8,18.4 0 0 0 281.8,605.0 L281.8,571.0 Z" style="fill:color-mix(in srgb,var(--metrics) 78%,#000)"/><ellipse cx="250.0" cy="571.0" rx="31.8" ry="18.4" style="fill:var(--metrics)"/></g></g>
