version: 1
meta:
  title: Superadvisor — tài liệu đi kèm buổi nói chuyện
  description: Một trang tóm tắt buổi nói chuyện Superadvisor/AgiAgentKit — vấn đề, kiến trúc, vòng đời một thẻ và số đo benchmark.
  locale: vi
theme:
  preset: paper-ink
blocks:
  - type: hero
    eyebrow: Tài liệu đi kèm · Session Superadvisor
    title: Một leader điều phối nhiều phiên Claude Code
    description: Một phiên leader chạy nhiều phiên Claude Code, có rào chắn và đo token sẵn. Bạn chỉ nói chuyện với một phiên, các phiên khác báo cáo cho nó.

  - type: section
    title: Vấn đề
    blocks:
      - type: card-grid
        items:
          - title: Bạn là nút thắt cổ chai
            text: Mỗi phiên đều hỏi duyệt hoặc hỏi hướng đi. Bạn rời máy là mọi thứ dừng.
          - title: Phiên kẹt không ai thấy
            text: Một hộp hỏi quyền mở từ trưa, một lane lặp mãi một lỗi — tới tối mới phát hiện.
          - title: Phiên dài đốt token
            text: Mỗi lượt đọc lại toàn bộ context. Phiên càng dài, mỗi câu hỏi càng đắt.

  - type: section
    title: Kiến trúc — Brains → leader → lanes
    blocks:
      - type: text
        text: Leader giao việc, gỡ kẹt cho lane và merge trong giới hạn bạn đặt. Bạn quyết định sản phẩm, production và quyền.
      - type: table
        columns: [Vai, Làm, Không bao giờ làm]
        rows:
          - [Owner (bạn), "Quyết định sản phẩm; duyệt merge, production, quyền", Đút việc tận tay cho từng lane]
          - [Leader, "Chia backlog, viết brief, mở lane, gỡ kẹt, merge trong giới hạn", Tự viết những khối code lớn]
          - [Lane, "Một thẻ, một worktree, một PR", "Merge hoặc đổi quyền — hook owner-guard chặn"]
          - [Brains, "Tuần tra 15 phút, review buổi tối, báo cáo buổi sáng", Thành kênh chat thứ hai]
      - type: steps
        title: Vòng lặp của leader sau mỗi sự kiện
        items:
          - title: Gỡ kẹt trước
            text: Viết lại brief hẹp hơn, mở lại lane.
          - title: Merge PR đã sẵn sàng
            text: Chỉ trong giới hạn owner cho phép; phần còn lại thì hỏi.
          - title: Giao việc cho lane rỗi
            text: Hai lane không bao giờ sửa cùng file.
          - title: Dọn dẹp
            text: Đóng lane, bỏ worktree đã merge.
          - title: Báo cáo ngắn
            text: Tối đa năm dòng, chỉ khi có gì mới. Không bao giờ chỉ ngồi chờ.
      - type: table
        title: Việc rõ cho model rẻ, việc khó cho model mạnh
        columns: [Agent, Model, Khi nào]
        rows:
          - [scout, haiku, "Tìm file, tra cứu, tóm tắt code"]
          - [builder, sonnet, "Sửa đã rõ nguyên nhân, 1–5 file"]
          - [tester, sonnet, Viết và sửa test]
          - [reviewer, opus, Một vòng review trước PR]
          - [debugger, opus, "Chưa rõ nguyên nhân, test đỏ hai lần"]
      - type: callout
        tone: info
        title: Rào chắn nằm trong hook, không nằm trong lời hứa
        text: "`turn-guard` cảnh báo ở 60 và 90 lần gọi tool, chặn từ 130. `agent-routing` từ chối ghi đè model. `test-budget` chặn chạy cả bộ test (trừ khi có `FULL_SUITE_OK=1`). `owner-guard` chặn lane merge hoặc đổi quyền khi `KIT_LANE=1`. Hook metrics ghi token mỗi lượt."

  - type: section
    title: Vòng đời một thẻ (ví dụ thẻ C3 của demo)
    blocks:
      - type: steps
        items:
          - title: Cài vào project một lần
            text: "`superadvisor init ~/demo-library` chép template (rules, `brains/`, một khối `CLAUDE.md`) vào project, không ghi đè gì."
          - title: Khởi động leader
            text: "`superadvisor up ~/demo-library` mở phiên tmux `DEMO-LIBRARY-LEAD` trên socket `sa`, auto mode, bật Remote Control."
          - title: Giao việc cho leader
            text: "Bạn gõ, ví dụ: đọc BACKLOG.md, phân cỡ từng thẻ, mở lane cho C3. Leader viết một brief cho mỗi thẻ cỡ M; thẻ cỡ S (1–3 file) leader tự làm."
          - title: Mở lane
            text: "`superadvisor lane open c3 --brief /path/to/c3-brief.md` tạo worktree `.claude/worktrees/c3`, nhánh `lane/c3` và phiên `DEMO-LIBRARY-C3` với `KIT_LANE=1`."
          - title: Theo dõi
            text: "`superadvisor status` cho mỗi phiên một dòng BUSY, IDLE, WAITING hoặc DEAD. `superadvisor patrol` gắn cờ KẸT khi chờ quyền ≥ 5 phút hoặc màn hình không đổi ≥ 20 phút."
          - title: PR
            text: "Lane chạy lệnh test trong brief, đẩy nhánh, mở PR vào nhánh tích hợp rồi dừng. Leader báo bạn tối đa năm dòng."
          - title: Merge khi bạn nói
            text: "Bạn trả lời `M 12`. Leader chỉ merge đúng head đã duyệt, test xanh trên head đó, không còn lỗi High/Critical sau tối đa hai vòng review."
          - title: Đóng lane và báo cáo
            text: "`superadvisor lane close c3 --rm-worktree` rồi `superadvisor report`: bảng phiên, cờ kẹt, commit trong ngày và chi phí ước tính."

  - type: section
    title: Số đo benchmark
    blocks:
      - type: callout
        tone: warning
        title: N = 1 cho mỗi thẻ
        text: "Mỗi chế độ chạy đúng một lần trên mỗi thẻ trong sáu thẻ của `demo-app/BACKLOG.md`, nên độ dao động chưa biết. Cả hai chế độ chạy headless, chỉ với cài đặt project."
      - type: benchmark-comparison
        title: "Baseline (một phiên Opus) so với superadvisor (leader Sonnet + agent phân tầng)"
        baseline:
          label: "baseline: một phiên Opus"
        candidate:
          label: "superadvisor: leader Sonnet + agent phân tầng"
        metrics:
          - label: Số thẻ đạt
            baseline: 6
            candidate: 6
            better: higher
            format: integer
          - label: Chi phí mỗi thẻ (USD)
            baseline: 0.292
            candidate: 0.270
            better: lower
            format: number
            decimals: 3
          - label: Thời gian mỗi thẻ (giây)
            baseline: 66
            candidate: 62
            better: lower
            format: integer
        method: "Một lần chạy cho mỗi thẻ ở mỗi chế độ trên sáu thẻ demo; `Cost USD` là `total_cost_usd` do Claude Code báo; thời gian là toàn bộ lần chạy `claude -p`."
        limitations: "N = 1. App demo nhỏ nên lợi thế của leader nhỏ; điều phối phát huy ở phiên dài và lane song song. Chạy headless không đo được số lần người phải can thiệp."
        source:
          label: bench/results.md
          href: ../../bench/results.md
      - type: list
        title: Kết quả cho thấy
        items:
          - text: Tỉ lệ đạt như nhau trên bộ test nghiệm thu ẩn (6/6 ở cả hai chế độ).
          - text: Superadvisor tốn 92% chi phí baseline. Tổng token nhiều hơn (chủ yếu cache read trên Sonnet và Haiku) nhưng giá rẻ hơn Opus.
          - text: Thời gian chạy gần như ngang nhau.
      - type: table
        title: Từng thẻ
        columns: [Chế độ, Thẻ, Đạt, Chi phí USD, Tổng token (k), Thời gian (s), Lần gọi agent của kit]
        rows:
          - [baseline, C1, có, "0.397", "195", "38", "-"]
          - [baseline, C2, có, "0.216", "161", "56", "-"]
          - [baseline, C3, có, "0.346", "220", "81", "-"]
          - [baseline, C4, có, "0.330", "216", "86", "-"]
          - [baseline, C5, có, "0.253", "204", "58", "-"]
          - [baseline, C6, có, "0.214", "201", "74", "-"]
          - [superadvisor, C1, có, "0.282", "314", "35", "2"]
          - [superadvisor, C2, có, "0.129", "259", "29", "0"]
          - [superadvisor, C3, có, "0.515", "803", "142", "4"]
          - [superadvisor, C4, có, "0.244", "372", "70", "2"]
          - [superadvisor, C5, có, "0.215", "397", "39", "2"]
          - [superadvisor, C6, có, "0.236", "232", "58", "1"]
      - type: stats
        title: Đo phiên chính, không chỉ subagent (đo nội bộ trên một project thật, ẩn danh, theo giá API niêm yết)
        items:
          - label: Token tiêu ở phiên chính — phần trước đây không ai đo
            value: "~70%"
          - label: Lượt chạy subagent quá 100 turn mỗi tuần, sau khi bật turn-guard
            value: "153 → 0"

